name: Documentation

# Builds the Sphinx documentation and, on pushes to `main`, deploys it to
# GitHub Pages. Pull requests only get a build check (broken docs should
# not merge), they are never deployed.
#
# geossm depends on a few native/mesh packages (gmsh, mfem, jax) that are
# installed via Conda in local development (see environment.yml) rather
# than plain pip; this workflow mirrors that and installs the same Conda
# environment so the package - and therefore `sphinx.ext.autodoc` - can
# actually be imported.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "pyproject.toml"
      - "environment.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the geossm Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: geossm
          miniforge-version: latest

      - name: Install documentation dependencies
        shell: bash -el {0}
        run: pip install -e ".[docs]"

      - name: Build HTML docs
        shell: bash -el {0}
        run: sphinx-build -b html docs/source docs/build/html

      - name: Upload built docs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geossm-docs-html
          path: docs/build/html
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
