# Development environment for geossm (CPU).
#
#   conda env create -f environment.yml && conda activate geossm
#
# The native geospatial/mesh stack comes from conda-forge; everything else,
# geossm itself (editable) included, is installed by pip from pyproject.toml,
# which is the single place where the supported version ranges live. Nothing
# is pinned here: this is the same recipe the CI workflows use.
#
# GPU: after creating the environment, `pip install -U "jax[cuda12]"` (see the
# JAX installation guide for the CUDA versions supported by your driver).
name: geossm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # Native geospatial/mesh stack
  - geopandas
  - shapely
  - pyarrow
  - gmsh
  - python-gmsh
  # Tools used outside the package (formatting, notebook export)
  - black
  - pandoc
  - pip:
    - -e .[test,interactive]
