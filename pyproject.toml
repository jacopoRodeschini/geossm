[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geossm"
dynamic = ["version"]
description = "GeoSSM: geostatistics state-space modeling tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Jacopo Rodeschini", email = "jacopo.rodeschini@unibg.it" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Lower bounds are the oldest versions the test suite is run against (CI
# `package` job, `uv --resolution lowest-direct` on Python 3.10).
dependencies = [
  "psutil>=6.0.0",
  "matplotlib>=3.9.1",
  "pandas>=2.2.2",
  "meshio>=5.3.5",
  "geopandas>=1.1.2",
  "gmsh>=4.15.0",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "mfem>=4.8.0.1",
  "gstools>=1.7.0",
  "numpy>=2.2.6",
  "patsy>=1.0.2",
  "pygmsh>=7.1.17",
  "pyarrow>=16.0.0",   # Parquet reader of `load_dataset` (via geopandas)
  "pyogrio>=0.12.1",   # Shapefile reader of `load_dataset` (via geopandas)
  "pyproj>=3.7.1",     # CRS handling (via geopandas)
  "scipy>=1.15.3",
  "shapely>=2.1.2",
  "statsmodels>=0.14.6",
]

keywords = ["geospatial", "state-space-models", "python", "geostatistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-design>=0.5.0",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5.1",
  "pre-commit>=3.7"
]
interactive = [
  "ipykernel>=6.29.5",
  "ipympl>=0.9.4",
  "ipython>=8.27.0",
  "ipywidgets>=8.1.5",
  "markdown-it-py>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/jacopoRodeschini/geossm"
Repository = "https://github.com/jacopoRodeschini/geossm"
Issues = "https://github.com/jacopoRodeschini/geossm/issues"

[tool.setuptools.dynamic]
version = { attr = "geossm._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]      
include = ["geossm*"]
exclude = ["old*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  # emitted by the MFEM SWIG bindings at import time; not actionable here
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]


[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

