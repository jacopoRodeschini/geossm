[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geossm"
version = "1.1.1"
description = "GeoSSM: geospatial state-space modeling tools"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Jacopo Rodeschini", email = "jacopo.rodeschini@unibg.it" }
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
  "psutil>=6.0.0",
  "matplotlib>=3.9.1",
  "pandas>=2.2.2",
  "meshio>=5.3.5",
  "geopandas>=1.1.2",
  "gmsh>=4.15.0",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "mfem>=4.8.0.1",
  "numba>=0.63.1",
  "numpy>=2.2.6",
  "patsy>=1.0.2",
  "pygmsh>=7.1.17",
  "pyogrio>=0.12.1",
  "pyproj>=3.7.1",
  "scipy>=1.15.3",
  "shapely>=2.1.2",
  "statsmodels>=0.14.6"
]

keywords = ["geospatial", "state-space-models", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=5.1",
  "pre-commit>=3.7"
]
interactive = [
  "ipykernel>=6.29.5",
  "ipympl>=0.9.4",
  "ipython>=8.27.0",
  "ipywidgets>=8.1.5",
  "markdown-it-py>=3.0.0",
  "pandoc>=3.4"
]

[project.urls]
Homepage = "https://github.com/jacopoRodeschini/geossm"
Repository = "https://github.com/jacopoRodeschini/geossm"
Issues = "https://github.com/jacopoRodeschini/geossm/issues"

[tool.setuptools.packages.find]
where = ["src"]      
include = ["geossm*"]
exclude = ["old*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

